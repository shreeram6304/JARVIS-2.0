<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Quantum Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">JARVIS <strong>CALC</strong></span>
            </div>
            
            <nav class="mode-selector">
                <button class="nav-btn active" data-tab="standard">Standard</button>
                <button class="nav-btn" data-tab="scientific">Scientific</button>
                <button class="nav-btn" data-tab="converter">Converter</button>
            </nav>

            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <span class="theme-icon">🌙</span>
                </button>
                <button id="history-toggle" class="icon-btn" title="Toggle History" aria-label="Toggle History">
                    <span class="history-icon">📜</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="calculator-body">
            <!-- Calculator Core Panel -->
            <div class="calc-panel">
                
                <!-- Screen / Display Section -->
                <div class="display-container">
                    <div class="status-bar">
                        <span id="angle-mode-indicator" class="badge">DEG</span>
                        <span id="memory-indicator" class="badge hidden">M</span>
                    </div>
                    <div id="sub-display" class="sub-display"></div>
                    <div id="main-display" class="main-display">0</div>
                </div>

                <!-- Calculator Keypads Container -->
                <div class="keypad-container">
                    
                    <!-- Memory Bar -->
                    <div class="memory-bar">
                        <button class="btn btn-mem" data-action="mc">MC</button>
                        <button class="btn btn-mem" data-action="mr">MR</button>
                        <button class="btn btn-mem" data-action="m-add">M+</button>
                        <button class="btn btn-mem" data-action="m-sub">M-</button>
                        <button class="btn btn-mem" data-action="ms">MS</button>
                    </div>

                    <!-- Scientific Keypad (Toggled in Scientific Mode) -->
                    <div id="scientific-keypad" class="keypad grid-sci hidden">
                        <button class="btn btn-sci" data-action="angle-toggle" id="btn-deg-rad">DEG</button>
                        <button class="btn btn-sci" data-value="sin(">sin</button>
                        <button class="btn btn-sci" data-value="cos(">cos</button>
                        <button class="btn btn-sci" data-value="tan(">tan</button>
                        <button class="btn btn-sci" data-value="π">π</button>

                        <button class="btn btn-sci" data-value="fact(">x!</button>
                        <button class="btn btn-sci" data-value="asin(">asin</button>
                        <button class="btn btn-sci" data-value="acos(">acos</button>
                        <button class="btn btn-sci" data-value="atan(">atan</button>
                        <button class="btn btn-sci" data-value="e">e</button>

                        <button class="btn btn-sci" data-value="sqrt(">√</button>
                        <button class="btn btn-sci" data-value="cbrt(">³√</button>
                        <button class="btn btn-sci" data-value="log10(">log</button>
                        <button class="btn btn-sci" data-value="ln(">ln</button>
                        <button class="btn btn-sci" data-value="^">x^y</button>

                        <button class="btn btn-sci" data-value="(">(</button>
                        <button class="btn btn-sci" data-value=")">)</button>
                        <button class="btn btn-sci" data-value="abs(">|x|</button>
                        <button class="btn btn-sci" data-value="exp(">exp</button>

                    </div>

                    <!-- Standard Keypad -->
                    <div class="keypad grid-standard">
                        <button class="btn btn-func" data-action="clear">C</button>
                        <button class="btn btn-func" data-action="backspace">⌫</button>
                        <button class="btn btn-func" data-action="percent">%</button>
                        <button class="btn btn-op" data-value="÷">÷</button>

                        <button class="btn btn-num" data-value="7">7</button>
                        <button class="btn btn-num" data-value="8">8</button>
                        <button class="btn btn-num" data-value="9">9</button>
                        <button class="btn btn-op" data-value="×">×</button>

                        <button class="btn btn-num" data-value="4">4</button>
                        <button class="btn btn-num" data-value="5">5</button>
                        <button class="btn btn-num" data-value="6">6</button>
                        <button class="btn btn-op" data-value="-">-</button>

                        <button class="btn btn-num" data-value="1">1</button>
                        <button class="btn btn-num" data-value="2">2</button>
                        <button class="btn btn-num" data-value="3">3</button>
                        <button class="btn btn-op" data-value="+">+</button>

                        <button class="btn btn-func" data-action="negate">±</button>
                        <button class="btn btn-num" data-value="0">0</button>
                        <button class="btn btn-num" data-value=".">.</button>
                        <button class="btn btn-equals" data-action="equals">=</button>
                    </div>

                </div>
            </div>

            <!-- Unit Converter Panel (Hidden by default) -->
            <div id="converter-panel" class="converter-panel hidden">
                <div class="converter-header">
                    <h2>Unit Converter</h2>
                </div>
                
                <div class="converter-form">
                    <div class="form-group">
                        <label for="conv-category">Category</label>
                        <select id="conv-category" class="form-control">
                            <option value="length">Length</option>
                            <option value="mass">Mass / Weight</option>
                            <option value="temperature">Temperature</option>
                            <option value="area">Area</option>
                            <option value="volume">Volume</option>
                            <option value="speed">Speed</option>
                            <option value="digital">Digital Storage</option>
                        </select>
                    </div>

                    <div class="converter-grid">
                        <div class="form-group">
                            <label for="conv-from-unit">From Unit</label>
                            <select id="conv-from-unit" class="form-control"></select>
                            <input type="number" id="conv-from-value" class="form-control val-input" value="1" step="any">
                        </div>

                        <div class="converter-swap-container">
                            <button id="conv-swap-btn" class="icon-btn swap-btn" title="Swap Units">⇄</button>
                        </div>

                        <div class="form-group">
                            <label for="conv-to-unit">To Unit</label>
                            <select id="conv-to-unit" class="form-control"></select>
                            <input type="text" id="conv-to-value" class="form-control val-input" readonly placeholder="Result">
                        </div>
                    </div>
                </div>
            </div>

            <!-- History Sidebar / Drawer -->
            <aside id="history-drawer" class="history-drawer">
                <div class="history-header">
                    <h3>Calculation History</h3>
                    <button id="clear-history-btn" class="btn-text">Clear</button>
                </div>
                <div id="history-list" class="history-list">
                    <div class="empty-history">No history records found</div>
                </div>
            </aside>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>

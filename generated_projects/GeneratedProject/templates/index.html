<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniCalc - Next-Gen Scientific Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">OmniCalc</span>
            </div>
            <nav class="nav-tabs">
                <button class="tab-btn active" data-tab="calculator">Calculator</button>
                <button class="tab-btn" data-tab="converter">Converter</button>
            </nav>
        </header>

        <main class="main-content">
            <!-- CALCULATOR SECTION -->
            <section id="calculator-tab" class="tab-content active">
                <div class="calc-wrapper">
                    <!-- Calculator Main View -->
                    <div class="calculator-card">
                        <div class="mode-toggle">
                            <button id="toggle-scientific" class="mode-btn">Scientific</button>
                        </div>
                        
                        <!-- Display -->
                        <div class="display-container">
                            <div id="expression-display" class="expression-line"></div>
                            <input type="text" id="main-display" class="result-line" placeholder="0" readonly>
                            <div id="error-display" class="error-line"></div>
                        </div>

                        <!-- Keypad -->
                        <div class="keypad">
                            <!-- Scientific Row (Hidden by default or toggled) -->
                            <div class="scientific-keys hidden" id="scientific-panel">
                                <button class="btn btn-func" data-action="func" data-val="sin(">sin</button>
                                <button class="btn btn-func" data-action="func" data-val="cos(">cos</button>
                                <button class="btn btn-func" data-action="func" data-val="tan(">tan</button>
                                <button class="btn btn-func" data-action="func" data-val="log(">log</button>
                                <button class="btn btn-func" data-action="func" data-val="ln(">ln</button>
                                <button class="btn btn-func" data-action="func" data-val="sqrt(">√</button>
                                <button class="btn btn-func" data-action="input" data-val="^">^</button>
                                <button class="btn btn-func" data-action="input" data-val="π">π</button>
                                <button class="btn btn-func" data-action="input" data-val="e">e</button>
                                <button class="btn btn-func" data-action="func" data-val="fact(">n!</button>
                            </div>

                            <!-- Standard Keypad -->
                            <div class="standard-keys">
                                <button class="btn btn-action" data-action="clear">AC</button>
                                <button class="btn btn-action" data-action="delete">DEL</button>
                                <button class="btn btn-operator" data-action="input" data-val="%">%</button>
                                <button class="btn btn-operator" data-action="input" data-val="÷">÷</button>

                                <button class="btn btn-num" data-action="input" data-val="7">7</button>
                                <button class="btn btn-num" data-action="input" data-val="8">8</button>
                                <button class="btn btn-num" data-action="input" data-val="9">9</button>
                                <button class="btn btn-operator" data-action="input" data-val="×">×</button>

                                <button class="btn btn-num" data-action="input" data-val="4">4</button>
                                <button class="btn btn-num" data-action="input" data-val="5">5</button>
                                <button class="btn btn-num" data-action="input" data-val="6">6</button>
                                <button class="btn btn-operator" data-action="input" data-val="-">-</button>

                                <button class="btn btn-num" data-action="input" data-val="1">1</button>
                                <button class="btn btn-num" data-action="input" data-val="2">2</button>
                                <button class="btn btn-num" data-action="input" data-val="3">3</button>
                                <button class="btn btn-operator" data-action="input" data-val="+">+</button>

                                <button class="btn btn-num" data-action="input" data-val="0">0</button>
                                <button class="btn btn-num" data-action="input" data-val=".">.</button>
                                <button class="btn btn-operator" data-action="input" data-val="(">(</button>
                                <button class="btn btn-operator" data-action="input" data-val=")">)</button>

                                <button class="btn btn-equals span-all" id="equals-btn">=</button>
                            </div>
                        </div>
                    </div>

                    <!-- History Panel -->
                    <div class="history-panel">
                        <div class="history-header">
                            <h3>History</h3>
                            <button id="clear-history-btn" class="text-btn">Clear</button>
                        </div>
                        <div id="history-list" class="history-list">
                            <p class="empty-history">No calculations yet</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- UNIT CONVERTER SECTION -->
            <section id="converter-tab" class="tab-content">
                <div class="converter-card">
                    <h2>Unit Converter</h2>
                    
                    <div class="form-group">
                        <label for="conv-category">Category</label>
                        <select id="conv-category" class="custom-select">
                            <option value="length">Length</option>
                            <option value="mass">Mass</option>
                            <option value="temperature">Temperature</option>
                            <option value="digital">Digital Storage</option>
                        </select>
                    </div>

                    <div class="converter-grid">
                        <div class="converter-box">
                            <label>From</label>
                            <input type="number" id="conv-from-val" class="custom-input" placeholder="0" value="1">
                            <select id="conv-from-unit" class="custom-select"></select>
                        </div>

                        <div class="swap-icon" id="swap-units-btn" title="Swap Units">⇄</div>

                        <div class="converter-box">
                            <label>To</label>
                            <input type="text" id="conv-to-val" class="custom-input" placeholder="0" readonly>
                            <select id="conv-to-unit" class="custom-select"></select>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
